[project]
name = "site-caesi"
version = "0.1.0"
description = "Repositorio do site do centro academico de computação"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt",
    "dotenv",
    "pypika",
    "fastapi",
    "pymysql",
    "sqlalchemy",
    "cryptography",
    "passlib[bcrypt]",
    "garage-admin-sdk",
    "boto3>=1.43.40",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-cov",
    "ruff",
    "pyright",
    "boto3-stubs[s3]>=1.43.51",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-fail-under=95"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service"]

[tool.uv.sources]
garage-admin-sdk = { git = "https://git.deuxfleurs.fr/garage-sdk/garage-admin-sdk-python" }
